version: 0.0
os: linux
file_exists_behaviour: OVERWRITE
files:
  - source: /
    destination: /opt/demo-app
hooks:
 BeforeInstall:
 - location: scripts/stop_server.sh
   timeout: 60
   runas: root
AfterInstall:
 - location: script/install.deps.sh
   timeout: 300
   runas: root
ApplicationStart:
 - location: scripts/start_server.sh
   timeout: 60
   runas: root
ValidateService:
 - location: scripts/validate.sh
   timeout: 60
   runas: root
